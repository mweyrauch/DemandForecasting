# Schneller Test mit synthetischen Daten (scripts/make_synthetic_m5.py).
# Baut auf default.yaml auf und nennt nur die abweichenden Werte.
extends: default.yaml

data:
  source: local
  dir: data/synthetic
  categories: [FOODS]

forecast:
  train_days: 500
  long_windows: [42, 84, 112]   # kurze Fenster, weil die synthetischen Daten nur 800 Tage haben
  backend: sklearn              # laeuft auch ohne LightGBM
  model_params:
    n_estimators: 100

inventory:
  model_floor: true             # prueft auch die Modellvariante mit Mindestbestand

evaluation:
  n_bootstrap: 100
