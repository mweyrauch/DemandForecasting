[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfi"
version = "0.1.0"
description = "Nachfrageprognose und Bestandssimulation auf dem M5-Datensatz"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "lightgbm",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
app = ["streamlit"]
kaggle = ["kagglehub"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
# feste Regelauswahl, damit neue ruff-Versionen die CI nicht unbemerkt verschaerfen
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["dfi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
