[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfi"
version = "0.1.0"
description = "Nachfrageprognose und Bestandssimulation auf dem M5-Datensatz"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "lightgbm",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
app = ["streamlit"]
kaggle = ["kagglehub"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
